<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maging - Garaj</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a); 
            color: #fff; 
            text-align: center; 
            padding-top: 30px; 
            font-family: sans-serif; 
            margin: 0;
            padding-left: 15px;
            padding-right: 15px;
            min-height: 100vh;
        }
        h1 { color: #ff3333; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
        .stats {
            background: rgba(34, 34, 34, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .garage-card {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 51, 51, 0.6);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(255, 51, 51, 0.2);
        }
        .car-img {
            font-size: 60px;
            margin: 10px 0;
            filter: drop-shadow(0 0 10px rgba(255,51,51,0.4));
        }
        button {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: rgba(51, 51, 51, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Car Maging Garaji</h1>
    <p style="color: #aaa; font-size: 14px;">Mashinangizni tanlang va yaxshilang!</p>

    <div class="stats">
        💰 Tanga: <span id="coins">0</span> | 🏎 Daraja: <span id="carLevel">1</span>
    </div>

    <div class="garage-card">
        <div class="car-img">🏎️</div>
        <h2 id="carName" style="margin: 10px 0;">Stayer X</h2>
        Tezlik: <span id="carSpeed">120</span> km/h
        <br><br>
        <button onclick="upgradeCar()">Garajni Yangilash (<span id="upgradeCost">50</span> tanga)</button>
    </div>

    <button class="btn-secondary" onclick="earnCoins()">🚗 Haydash / Tanga topish (+10)</button>

    <script>
        let coins = 0;
        let level = 1;
        let speed = 120;
        let cost = 50;

        function updateUI() {
            document.getElementById("coins").innerText = coins;
            document.getElementById("carLevel").innerText = level;
            document.getElementById("carSpeed").innerText = speed;
            document.getElementById("upgradeCost").innerText = cost;
        }

        function earnCoins() {
            coins += 10 * level;
            updateUI();
        }

        function upgradeCar() {
            if (coins >= cost) {
                coins -= cost;
                level += 1;
                speed += 30;
                cost = Math.floor(cost * 1.8);
                
                if(level == 2) document.getElementById("carName").innerText = "Turbo V8";
                if(level == 3) document.getElementById("carName").innerText = "Street Monster ⚡";

                alert("Tabriklayman! Garaj yangilandi! 🎉");
                updateUI();
            } else {
                alert("Tangangiz yetarli emas! Ko'proq 'Haydash' tugmasini bosing.");
            }
        }
    </script>

</body>
</html>
