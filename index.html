<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maging - Garaj</title>
    <style>
        body { 
            background-color: #111; 
            color: #fff; 
            text-align: center; 
            padding-top: 30px; 
            font-family: sans-serif; 
            margin: 0;
            padding-left: 15px;
            padding-right: 15px;
        }
        h1 { color: #ff3333; margin-bottom: 5px; }
        .stats {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 18px;
            border: 1px solid #444;
        }
        .garage-card {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }
        .car-img {
            font-size: 50px;
            margin: 10px 0;
        }
        button {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
            background-color: #cc0000;
        }
        .btn-secondary {
            background-color: #333;
            border: 1px solid #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Car Maging Garaji</h1>
    <p style="color: #aaa; font-size: 14px;">Mashinangizni tanlang va yaxshilang!</p>

    <div class="stats">
        💰 Tanga: <span id="coins">0</span> | 🏎 Daraja: <span id="carLevel">1</span>
    </div>

    <div class="garage-card">
        <div class="car-img">🏎️</div>
        <h2 id="carName" style="margin: 10px 0;">Stayer X</h2>
        Tezlik: <span id="carSpeed">120</span> km/h
        <br><br>
        <button onclick="upgradeCar()">Garajni Yangilash (<span id="upgradeCost">50</span> tanga)</button>
    </div>

    <button class="btn-secondary" onclick="earnCoins()">🚗 Haydash / Tanga topish (+10)</button>

    <script>
        let coins = 0;
        let level = 1;
        let speed = 120;
        let cost = 50;

        function updateUI() {
            document.getElementById("coins").innerText = coins;
            document.getElementById("carLevel").innerText = level;
            document.getElementById("carSpeed").innerText = speed;
            document.getElementById("upgradeCost").innerText = cost;
        }

        function earnCoins() {
            coins += 10 * level;
            updateUI();
        }

        function upgradeCar() {
            if (coins >= cost) {
                coins -= cost;
                level += 1;
                speed += 30;
                cost = Math.floor(cost * 1.8);
                
                if(level == 2) document.getElementById("carName").innerText = "Turbo V8";
                if(level == 3) document.getElementById("carName").innerText = "Street Monster ⚡";

                alert("Tabriklayman! Garaj yangilandi! 🎉");
                updateUI();
            } else {
                alert("Tangangiz yetarli emas! Ko'proq 'Haydash' tugmasini bosing.");
            }
        }
    </script>

</body>
</html>
